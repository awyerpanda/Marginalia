<style>
*{box-sizing:border-box}

  --accent-ink:#FFFFFF;

  --danger:#B3321F;

  --toast-fg:#F4F6FC;

    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1118;--bar:#191C27;--bar2:#141720;--fg:#E7EAF3;--muted:#98A1B9;--line:#2B3043;
  --accent:#86A2FF;--accent-ink:#0B1230;--accent-soft:#222B55;--danger:#FF8F7E;
  --sheet-shadow:0 1px 2px rgba(0,0,0,.55),0 12px 32px rgba(0,0,0,.55);
  --toast-bg:#E7EAF3;--toast-fg:#12151F;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;overflow:hidden}
button,input{font-family:inherit}
.app{height:100%;display:flex;flex-direction:column;min-width:0}

.tools>*{flex:none}
.group{display:flex;align-items:center;gap:6px}
.spacer{flex:1 1 0;min-width:0}
.brand{display:flex;align-items:center;gap:8px;font:700 18px/1 var(--font-display);letter-spacing:-.01em;margin-right:6px}

.credit a{color:var(--muted);text-decoration:underline;text-underline-offset:2px}

.btn:disabled{opacity:.4;cursor:default}
.btn.sq{width:34px;padding:0}
:is(button,input,textarea):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ico{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.tool:hover{background:var(--accent-soft)}
.tool[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.sw{width:24px;height:24px;border-radius:50%;border:0;padding:0;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}

.size input{width:104px;accent-color:var(--accent)}

.size.off{opacity:.4}

.stage.drop{outline:2px dashed var(--accent);outline-offset:-10px}

.loading{color:var(--muted);padding:48px 0}
.pg{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:236px}
.pghead{width:100%;display:flex;align-items:center;gap:2px}
.pgno{margin-right:auto;color:var(--muted)}
.mini{width:28px;height:28px;border-radius:6px;border:0;background:transparent;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}

.mini.del:hover{color:var(--danger)}
.sheet{position:relative;background:#fff;box-shadow:var(--sheet-shadow);flex:none}
.sheet canvas{display:block}
.ov{position:absolute;inset:0;width:100%;height:100%;user-select:none;-webkit-user-select:none}
.app[data-tool="select"] .ov{touch-action:pan-x pan-y pinch-zoom}
.app:not([data-tool="select"]) .ov{touch-action:none}
.app[data-tool="select"] .ann{cursor:move;touch-action:none}
.app[data-tool="text"] .ov{cursor:text}
.app:not([data-tool="select"]):not([data-tool="text"]) .ov{cursor:crosshair}
.ann[data-i="-1"]{pointer-events:none}
.handle{cursor:nwse-resize;touch-action:none}
.tedit{position:absolute;margin:0;padding:0;border:0;outline:1.5px dashed var(--accent);background:rgba(255,255,255,.75);resize:none;overflow:hidden;font-family:Helvetica,Arial,sans-serif;line-height:1.2;transform-origin:0 0;white-space:pre;z-index:3;min-width:40px}

.hov{fill:none;stroke:var(--accent);stroke-width:1px;stroke-opacity:.7;pointer-events:none}
.marq{fill:var(--accent);fill-opacity:.08;stroke:var(--accent);stroke-width:1px;pointer-events:none}

.sw.none[hidden]{display:none}
.cpick{position:relative;width:24px;height:24px;border-radius:50%;overflow:hidden;flex:none;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25);background:conic-gradient(#e5322d,#f5c400,#1c9a5b,#1f5bff,#8a3ffc,#e5322d)}

.seg{display:flex;flex:none;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg[hidden]{display:none}
.seg button{font:500 12px var(--font-body);border:0;background:transparent;color:var(--fg);padding:7px 10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.fsel{font:500 13px var(--font-body);height:32px;max-width:220px;padding:0 8px;border:1px solid var(--line);border-radius:7px;background:var(--bar);color:var(--fg);flex:none;cursor:pointer}
.fsel[hidden]{display:none}
.selcount{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.tbox:hover,.tbox:focus{fill:var(--accent);fill-opacity:.1;stroke:var(--accent);stroke-width:1px}
.tedit.x{background:transparent;white-space:pre;outline-offset:2px}
.fontinfo{position:absolute;z-index:4;display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12px;color:var(--muted);background:var(--bar);border:1px solid var(--line);border-radius:7px;padding:5px 8px;box-shadow:0 4px 14px rgba(20,28,60,.14);pointer-events:none;max-width:min(440px,calc(100vw - 32px))}

.fontinfo .tag{font:600 10.5px var(--font-body);letter-spacing:.05em;text-transform:uppercase;padding:2px 6px;border-radius:4px;background:var(--accent-soft);color:var(--accent)}

.forms{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none;z-index:2}
.ff{position:absolute;margin:0;border:0;border-radius:0;padding:0 2px;pointer-events:auto;font-family:Helvetica,Arial,sans-serif;line-height:1.15;color:#111;box-shadow:inset 0 0 0 200px rgba(33,80,232,.07);outline:none}

.ff:focus,.ff:focus-visible{box-shadow:inset 0 0 0 200px rgba(33,80,232,.04),0 0 0 1.5px #2150E8}

}

function openFile(file,force){

document.addEventListener('keydown',function(e){
  var tag=(e.target.tagName||'').toLowerCase(),key=(e.key||'').toLowerCase();
  var mod=e.metaKey||e.ctrlKey,typing=tag==='textarea'||tag==='input'||tag==='select'||e.target.isContentEditable;
  if(mod&&key==='s'){e.preventDefault();if(typing&&e.target.blur)e.target.blur();save();return;}
  if(typing)return;
  if(mod&&key==='z'){e.preventDefault();e.shiftKey?redo():undo();return;}
  if(mod&&key==='y'){e.preventDefault();redo();return;}
  if(mod&&key==='a'){e.preventDefault();if(S.tool!=='select')setTool('select');selectAllOnPage();return;}
  if(mod||e.altKey)return;
  if(e.key==='Delete'||e.key==='Backspace'){if(S.sel.length){e.preventDefault();deleteSel();}return;}
  if(e.key==='Escape'){if(S.sel.length)setSel([]);else setTool('select');return;}
  var k=e.key.toUpperCase();
  for(var i=0;i<TOOLS.length;i++)if(TOOLS[i][2]===k){setTool(TOOLS[i][0]);return;}
});
